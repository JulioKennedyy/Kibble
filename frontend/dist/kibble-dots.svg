      <stop offset="45%" stopColor="#9333ea"/>
      <stop offset="85%" stopColor="#6b21a8"/>
      <stop offset="100%" stopColor="#3b0764"/>
    </radialGradient>
    <linearGradient id="fav-clean-token" x1="0%" y1="0%" x2="100%" y2="100%">
