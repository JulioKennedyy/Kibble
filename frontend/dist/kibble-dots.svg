  <circle cx="14" cy="39" r="2.7" fill="#6d28d9"/>
  <circle cx="48" cy="39" r="2.7" fill="#7c3aed"/>
  <circle cx="19" cy="43" r="2.9" fill="#6d28d9"/>
  <circle cx="25" cy="44" r="3.2" fill="#6d28d9"/>
