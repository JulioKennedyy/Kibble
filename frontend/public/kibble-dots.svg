<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="body" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#f4f2ff"/>
      <stop offset="0.34" stop-color="#c4b5fd"/>
      <stop offset="0.72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </radialGradient>
  </defs>

  <!-- Curled token antenna -->
  <circle cx="29" cy="9" r="4" fill="#ddd6fe"/>
  <circle cx="25" cy="5.5" r="3" fill="#a78bfa"/>
  <circle cx="21.5" cy="7.5" r="2.2" fill="#7c3aed"/>

  <!-- A simple silhouette reads clearly as Kibble at favicon size. -->
  <path d="M13 27C15 16 25 12 35 13c11 1 18 8 18 19 0 13-9 22-23 22S9 45 11 34c.4-3 1-5 2-7Z" fill="url(#body)"/>

  <!-- A few large rim tokens instead of dozens of unreadable dots. -->
  <circle cx="15" cy="24" r="4.1" fill="#ede9fe"/>
  <circle cx="20" cy="17" r="4" fill="#c4b5fd"/>
  <circle cx="29" cy="14" r="4.3" fill="#ddd6fe"/>
  <circle cx="39" cy="16" r="4" fill="#a78bfa"/>
  <circle cx="48" cy="22" r="3.8" fill="#8b5cf6"/>
  <circle cx="13" cy="34" r="4" fill="#a78bfa"/>
  <circle cx="17" cy="44" r="4.2" fill="#7c3aed"/>
  <circle cx="25" cy="51" r="4" fill="#6d28d9"/>
  <circle cx="37" cy="51" r="4" fill="#7c3aed"/>
  <circle cx="47" cy="45" r="4" fill="#6d28d9"/>

  <!-- Interior tokens make the material readable without visual noise. -->
  <circle cx="21" cy="29" r="2.7" fill="#ffffff" opacity=".2"/>
  <circle cx="34" cy="20" r="2.4" fill="#ffffff" opacity=".18"/>
  <circle cx="45" cy="36" r="2.8" fill="#ddd6fe" opacity=".22"/>
  <circle cx="29" cy="45" r="3" fill="#c4b5fd" opacity=".2"/>

  <!-- Soft dark eyes with two highlights stay friendly at every size. -->
  <ellipse cx="27" cy="29.5" rx="3.25" ry="4.15" fill="#160b2b"/>
  <ellipse cx="40" cy="28.5" rx="3.25" ry="4.15" fill="#160b2b"/>
  <circle cx="26" cy="27.9" r="1.05" fill="#ffffff"/>
  <circle cx="39" cy="26.9" r="1.05" fill="#ffffff"/>
  <circle cx="27.8" cy="30.8" r=".45" fill="#c4b5fd" opacity=".8"/>
  <circle cx="40.8" cy="29.8" r=".45" fill="#c4b5fd" opacity=".8"/>
  <path d="M30 37c3 3 6 3 9-.5" fill="none" stroke="#160b2b" stroke-width="2.6" stroke-linecap="round"/>

</svg>
